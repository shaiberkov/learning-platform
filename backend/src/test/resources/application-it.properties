# Integration tests (AbstractMySqlIntegrationTest). The datasource comes from the Testcontainers MySQL
# container through @ServiceConnection. Flyway builds the schema from V1 on the empty database and
# Hibernate only validates it, so drift between the migrations and the entities fails the build.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
sentry.dsn=
