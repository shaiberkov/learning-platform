<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preload" href="/logo.png" as="image" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="מערכת חכמה לניהול ותכנון בתי ספר הכוללת תקשורת בין תלמידים, מורים והנהלה, לצד מערכת למידה אינטראקטיבית." />
    <meta name="keywords" content="ניהול בתי ספר, מערכת חינוכית, תקשורת תלמידים מורים, למידה אינטראקטיבית, מערכת חינוך דיגיטלית, מערכת לניהול כיתה" />
    <meta name="author" content="שי ושון ברקוביץ" />
    <meta property="og:title" content="מערכת ניהול ולמידה לבתי ספר" />
    <meta property="og:description" content="מערכת חדשנית לניהול בית ספר וללמידה אינטראקטיבית עם אינטגרציה מלאה בין תלמידים, מורים והנהלה." />
    <meta property="og:image" content="https://schoolmanagmentsystem-z0m5.onrender.com/sharedLogo.png" />
    <meta property="og:url" content="https://schoolmanagmentsystem-z0m5.onrender.com" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#06070d" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      (function () {
        try {
          var t = localStorage.getItem("lp-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
      // Apply the saved interface language (src/i18n) before first paint: Arabic is RTL, English LTR.
      (function () {
        try {
          var l = localStorage.getItem("lp-lang");
          if (l === "ar" || l === "en") {
            document.documentElement.lang = l;
            document.documentElement.dir = l === "en" ? "ltr" : "rtl";
          }
        } catch (e) {}
      })();
    </script>
    <title>מערכת ניהול ולמידה אינטראקטיבית לבתי ספר</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
