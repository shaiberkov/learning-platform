
spring.application.name=learningProjectServer
server.port=8080
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.cache.jcache.config=classpath:ehcache.xml

spring.profiles.active=production
#spring.profiles.active=dev
spring.jpa.properties.hibernate.jdbc.batch_size = 50
spring.jpa.properties.hibernate.order_inserts  = true
spring.jpa.properties.hibernate.order_updates  = true

# --- Auth cookies and tokens (httpOnly cookies; see docs/SPEC.md "Login") ---
# Production: frontend and API are on different sites, so cookies need Secure + SameSite=None.
# application-dev.properties overrides these for http://localhost.
auth.cookie.secure=true
auth.cookie.same-site=None
auth.access-token.ttl-minutes=15
auth.refresh-token.ttl-days=7
auth.refresh-token.reuse-grace-seconds=30

# --- Rate limiting (Bucket4j, in memory, per IP and per user; 429 when exceeded) ---
# Per-IP limits are generous because a whole school can share one IP; per-user limits are strict.
rate-limit.enabled=true
rate-limit.trust-forwarded-for=true
rate-limit.rules.login.ip-capacity=100
rate-limit.rules.login.user-capacity=10
rate-limit.rules.login.period=15m
rate-limit.rules.otp-send.ip-capacity=50
rate-limit.rules.otp-send.user-capacity=3
rate-limit.rules.otp-send.period=15m
rate-limit.rules.otp-verify.ip-capacity=100
rate-limit.rules.otp-verify.user-capacity=5
rate-limit.rules.otp-verify.period=15m
rate-limit.rules.password-reset.ip-capacity=30
rate-limit.rules.password-reset.user-capacity=6
rate-limit.rules.password-reset.period=1h
rate-limit.rules.ai-chat.ip-capacity=300
rate-limit.rules.ai-chat.user-capacity=30
rate-limit.rules.ai-chat.period=10m
