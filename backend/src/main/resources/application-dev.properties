spring.datasource.url=jdbc:mysql://localhost:3306/learning?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace


# Local http: the browser drops Secure cookies over http, and localhost:5173 -> localhost:8080 is same-site.
auth.cookie.secure=false
auth.cookie.same-site=Lax
rate-limit.trust-forwarded-for=false
